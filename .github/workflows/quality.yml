name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-store/package-lock.json
      - name: Install canonical native dependencies
        run: npm ci --prefix app-store
      - name: Parse, release-policy, and regression tests
        run: npm run check
      - name: Dependency vulnerability audit
        run: npm run audit:dependencies
      - name: Build and audit native web bundle
        run: npm run native:verify

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  production-e2e:
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && vars.E2E_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: app-store/package-lock.json
      - name: Install E2E dependencies
        run: npm ci --prefix app-store
      - name: Install Chromium
        run: npx --prefix app-store playwright install --with-deps chromium
      - name: Run production account and scheduling journeys
        run: npm run test:e2e
        env:
          E2E_BASE_URL: https://www.workandworkout.com
          E2E_USER_A_EMAIL: ${{ secrets.E2E_USER_A_EMAIL }}
          E2E_USER_A_PASSWORD: ${{ secrets.E2E_USER_A_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
